{% extends "core/base.html" %}

{% block title %}Login - ZKTeco F18 Attendance Bridge{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2>Login</h2>

    {% if form.errors %}
        <p style="color: #721c24; background: #f8d7da; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem;">
            Your username and password didn't match. Please try again.
        </p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label for="id_username" style="display: block; margin-bottom: 0.25rem;">Username</label>
            <input type="text" name="username" id="id_username" style="width: 100%;" autofocus required>
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="id_password" style="display: block; margin-bottom: 0.25rem;">Password</label>
            <input type="password" name="password" id="id_password" style="width: 100%;" required>
        </div>
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <button type="submit" class="btn btn-primary" style="width: 100%;">Log in</button>
    </form>
</div>
{% endblock %}
